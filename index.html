<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
    <style>
      :root {
        --bg: #0f1117;
        --panel: #171a23;
        --border: #2a2f3d;
        --ink: #e8ecf4;
        --muted: #8b93a7;
        --accent: #00d7d7;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        -webkit-font-smoothing: antialiased;
      }
      .app {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 24px;
        gap: 20px;
      }
      .board-wrap {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px;
        background: var(--panel);
      }
      canvas { display: block; image-rendering: pixelated; }
      .side {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 200px;
      }
      .panel {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        background: var(--panel);
      }
      .panel h1 {
        margin: 0 0 12px;
        font-size: 20px;
        letter-spacing: 1px;
        color: var(--accent);
      }
      .stat {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        font-size: 14px;
      }
      .stat .label { color: var(--muted); }
      .stat .value { font-weight: 700; font-size: 16px; }
      .next-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .next-wrap .label {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .help {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.7;
      }
      .help b { color: var(--ink); font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>
      </div>
      <div class="side">
        <div class="panel">
          <h1>TETRIS</h1>
          <div class="stat"><span class="label">Score</span><span class="value" id="score">0</span></div>
          <div class="stat"><span class="label">Level</span><span class="value" id="level">1</span></div>
          <div class="stat"><span class="label">Lines</span><span class="value" id="lines">0</span></div>
        </div>
        <div class="panel next-wrap">
          <span class="label">Next</span>
          <canvas id="next" width="100" height="100"></canvas>
        </div>
        <div class="panel help">
          <div><b>&larr;</b> <b>&rarr;</b> move</div>
          <div><b>&uarr;</b> rotate</div>
          <div><b>&darr;</b> soft drop</div>
          <div><b>Space</b> hard drop</div>
          <div><b>P</b> pause</div>
          <div><b>R</b> restart</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
